# Durby staging stack (Hetzner CPX22: 2 vCPU, 4 GB RAM). See docs/ops/deploy.md.
# Lives in /opt/durby on the server; run it through bin/dc, which supplies .env and IMAGE_TAG.
#
# Only Caddy publishes public ports (80/443); Mailpit's UI is on the server's 127.0.0.1 only. Postgres and
# Redis sit on the internal `db` network, which has no route to the host or the internet.
# Distinct from the local dev project ("durby", from the repo folder) so the two never share containers or volumes.
name: durby-staging

x-logging: &logging
  driver: json-file
  options: { max-size: 10m, max-file: '5' }

x-hardening: &hardening
  security_opt: ['no-new-privileges:true']
  cap_drop: [ALL]

# Shared by the api and the outbox worker (same image, same config).
x-api-env: &api-env
  NODE_ENV: production
  APP_VERSION: ${IMAGE_TAG}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  # durby_app only: no BYPASSRLS, no ownership (ADR 0002). The migrator URL never reaches the api.
  DATABASE_URL: postgresql://durby_app:${DURBY_APP_PASSWORD}@postgres:5432/durby
  REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
  # Auth (docs/platform/auth.md). Web and api share the origin behind Caddy.
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set in .env (see docs/ops/deploy.md, Upgrading the existing server)}
  WEB_ORIGINS: https://${STAGING_DOMAIN}
  WEB_BASE_URL: https://${STAGING_DOMAIN}
  # Caddy is the one proxy in front of the api; it overwrites client-sent X-Forwarded-For.
  TRUST_PROXY: '1'
  SMTP_URL: smtp://mailpit:1025
  MAIL_FROM: ${MAIL_FROM:-Durby Staging <no-reply@staging.invalid>}

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set in .env}
      POSTGRES_DB: durby
      # Read once by postgres-init/01-roles.sh on the first start (empty volume).
      DURBY_MIGRATOR_PASSWORD: ${DURBY_MIGRATOR_PASSWORD:?set in .env}
      DURBY_APP_PASSWORD: ${DURBY_APP_PASSWORD:?set in .env}
    # Sized for ~1 GB of the 4 GB host; the rest is for api, web, Redis and the page cache.
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=768MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - max_connections=50
      - -c
      - wal_buffers=8MB
      - -c
      - max_wal_size=1GB
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
      - -c
      - log_min_duration_statement=500ms
    shm_size: 128mb
    deploy:
      resources:
        limits: { memory: 1280m }
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    networks: [db]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d durby']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set in .env}
    # Password goes into a config file, not argv, so it never shows up in `ps`.
    # noeviction: BullMQ must never lose jobs to eviction.
    command:
      - sh
      - -c
      - >-
        umask 077 && printf 'requirepass %s\n' "$$REDIS_PASSWORD" > /tmp/redis.conf &&
        exec redis-server /tmp/redis.conf --appendonly yes
        --maxmemory 192mb --maxmemory-policy noeviction
    deploy:
      resources:
        limits: { memory: 256m }
    volumes:
      - redis-data:/data
    networks: [db]
    healthcheck:
      test: ['CMD-SHELL', 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 5s
      retries: 20

  # Release step, run by bin/deploy.sh before the new api starts. Never started by `up`.
  migrate:
    image: ${IMAGE_PREFIX:-ghcr.io/yuva809/durby}-api-migrate:${IMAGE_TAG:?set by bin/dc}
    profiles: [release]
    restart: 'no'
    <<: *hardening
    logging: *logging
    environment:
      MIGRATION_DATABASE_URL: postgresql://durby_migrator:${DURBY_MIGRATOR_PASSWORD}@postgres:5432/durby
    depends_on:
      postgres: { condition: service_healthy }
    networks: [db]

  api:
    image: ${IMAGE_PREFIX:-ghcr.io/yuva809/durby}-api:${IMAGE_TAG:?set by bin/dc}
    restart: unless-stopped
    <<: *hardening
    read_only: true
    tmpfs: [/tmp]
    logging: *logging
    environment: *api-env
    deploy:
      resources:
        limits: { memory: 512m }
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      mailpit: { condition: service_started }
    # Healthcheck comes from the image: GET /api/v1/health/live.
    networks: [db, edge, mail]

  # Outbox worker (docs/platform/outbox.md, ADR 0013 §9): same image as the api, no HTTP. Publishes
  # committed events to BullMQ and runs their handlers. Started by bin/deploy.sh only for images
  # labelled org.durby.worker, so a rollback to a release without it removes the service.
  # Operator CLI: bin/dc run --rm worker node dist/cli/outbox.js dead-letters
  worker:
    image: ${IMAGE_PREFIX:-ghcr.io/yuva809/durby}-api:${IMAGE_TAG:?set by bin/dc}
    command: ['node', 'dist/worker.js']
    restart: unless-stopped
    <<: *hardening
    read_only: true
    tmpfs: [/tmp]
    logging: *logging
    environment: *api-env
    deploy:
      resources:
        limits: { memory: 256m }
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    # Replaces the image's HTTP healthcheck: the worker touches /tmp/worker.alive on every dispatcher
    # pass (at most every 5 s); older than 30 s means the loop is stuck.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "const t=Number(require('fs').readFileSync('/tmp/worker.alive','utf8'));process.exit(Date.now()-t<30000?0:1)"
      interval: 15s
      timeout: 3s
      start_period: 20s
      retries: 3
    # Postgres and Redis only: no edge, no mail.
    networks: [db]

  # Catches all staging mail (reset/verification links) until a real provider exists (ADR 0006).
  # SMTP only on the internal `mail` network; the UI is published on the server's loopback only:
  #   ssh -L 8025:127.0.0.1:8025 <you>@<server>   then open http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.31.4
    restart: unless-stopped
    <<: *hardening
    read_only: true
    tmpfs: [/tmp, /data]
    logging: *logging
    environment:
      # Keep the newest 500 messages, in memory/tmpfs only: a restart drops them.
      MP_MAX_MESSAGES: '500'
    ports:
      - '127.0.0.1:8025:8025'
    deploy:
      resources:
        limits: { memory: 96m }
    networks: [mail, mailui]

  web:
    image: ${IMAGE_PREFIX:-ghcr.io/yuva809/durby}-web:${IMAGE_TAG:?set by bin/dc}
    restart: unless-stopped
    <<: *hardening
    read_only: true
    tmpfs:
      - /tmp
      - /app/apps/web/.next/cache:uid=1000,gid=1000
    logging: *logging
    environment:
      APP_VERSION: ${IMAGE_TAG}
      API_URL: http://api:4000
    deploy:
      resources:
        limits: { memory: 384m }
    depends_on: [api]
    # Healthcheck comes from the image: GET /healthz.
    networks: [edge]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *logging
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ['no-new-privileges:true']
    environment:
      STAGING_DOMAIN: ${STAGING_DOMAIN:?set in .env}
      ACME_EMAIL: ${ACME_EMAIL:?set in .env}
      BASIC_AUTH_USER: ${BASIC_AUTH_USER:?set in .env}
      BASIC_AUTH_HASH: ${BASIC_AUTH_HASH:?set in .env}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    deploy:
      resources:
        limits: { memory: 128m }
    # A directory mount, so a replaced Caddyfile is visible to `caddy reload`.
    volumes:
      - ./caddy:/etc/caddy:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [api, web]
    networks: [edge]

networks:
  # No external connectivity: only containers on this network can reach Postgres/Redis.
  db:
    internal: true
  edge: {}
  # api → Mailpit SMTP. Internal: Mailpit never sends mail out.
  mail:
    internal: true
  # Only for publishing the Mailpit UI on 127.0.0.1 (internal networks cannot publish ports).
  mailui: {}

volumes:
  postgres-data:
  redis-data:
  caddy-data:
  caddy-config:
