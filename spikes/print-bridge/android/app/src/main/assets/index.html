<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Print bridge spike</title>
  </head>
  <body style="font: 16px sans-serif; padding: 16px">
    <p>
      Baseline check from the bridge's own origin (http://127.0.0.1:17890). The real test runs the
      same script from the Durby https page through the bookmarklet (spikes/print-bridge/README.md).
    </p>
    <button
      onclick="
        var s = document.createElement('script');
        s.src = '/spike.js?' + Date.now();
        document.body.append(s);
      "
      style="font-size: 18px; padding: 12px 20px"
    >
      Run diagnostics
    </button>
  </body>
</html>
