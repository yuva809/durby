name: Deploy staging

# Builds the images of a commit that passed CI on main, pushes them to GHCR and rolls them out
# to the Hetzner server over SSH. See docs/ops/deploy.md and docs/adr/0004-staging-deployment.md.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # Redeploy or roll back to a release that was already built (images tagged with its SHA).
  workflow_dispatch:
    inputs:
      sha:
        description: Full git SHA of an already-built release
        required: true
      skip_migrations:
        description: Skip migrations (rolling back to an older release)
        type: boolean
        default: true

# One deploy at a time; a queued deploy waits instead of cancelling the running one.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/durby
  DEPLOY_DIR: /opt/durby
  STAGING_URL: https://staging.durby.tech

jobs:
  release:
    name: Resolve release
    # Only a successful CI run for a push to main; never PRs, never other branches.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      # The commit CI tested, never "current main" (it may have moved on). Inputs go through
      # env, not ${{ }} in the script, so they cannot inject shell.
      - id: sha
        env:
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          INPUT_SHA: ${{ inputs.sha }}
        run: |
          sha="${INPUT_SHA:-$RUN_SHA}"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::not a full git SHA: $sha"; exit 1; }
          echo "sha=$sha" >>"$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.image }}
    needs: release
    if: github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - { image: api, dockerfile: apps/api/Dockerfile, target: runtime }
          - { image: api-migrate, dockerfile: apps/api/Dockerfile, target: migrate }
          - { image: web, dockerfile: apps/web/Dockerfile, target: runtime }
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.release.outputs.sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.image }}:${{ needs.release.outputs.sha }}
            ${{ env.IMAGE_PREFIX }}-${{ matrix.image }}:staging
          build-args: APP_VERSION=${{ needs.release.outputs.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.release.outputs.sha }}
          # Same cache scopes as the CI image job, so main reuses the PR build layers.
          cache-from: type=gha,scope=${{ matrix.dockerfile }}-${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.dockerfile }}-${{ matrix.target }}

  deploy:
    name: Deploy to staging
    needs: [release, build]
    # Runs after a successful build, or directly for a manual redeploy/rollback (build skipped).
    if: >-
      always() && needs.release.result == 'success' &&
      (needs.build.result == 'success' ||
       (github.event_name == 'workflow_dispatch' && needs.build.result == 'skipped'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: staging
      url: ${{ env.STAGING_URL }}
    permissions:
      contents: read
      packages: read
    env:
      SHA: ${{ needs.release.outputs.sha }}
      SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
    steps:
      # Server config (compose, Caddyfile, scripts) comes from the same commit as the images.
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.release.outputs.sha }}

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" >~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Pinned host key: never trust on first use.
          printf '%s\n' "$KNOWN_HOSTS" >~/.ssh/known_hosts
          printf 'Host staging\n  HostName %s\n  User deploy\n  IdentitiesOnly yes\n  StrictHostKeyChecking yes\n' \
            "$SSH_HOST" >~/.ssh/config

      - name: Upload server config
        run: |
          tar -C infra/staging -cz docker-compose.staging.yml caddy postgres-init bin \
            | ssh staging "tar -C '$DEPLOY_DIR' -xz"

      # The job's short-lived token, via stdin; logged out again in the last step.
      - name: Log in to GHCR on the server
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: printf '%s' "$GHCR_TOKEN" | ssh staging "docker login ghcr.io -u '$GHCR_USER' --password-stdin"

      - name: Run deploy.sh
        env:
          SKIP_MIGRATIONS: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_migrations }}
        run: |
          flag=""
          [[ "$SKIP_MIGRATIONS" == "true" ]] && flag="--skip-migrations"
          ssh staging "$DEPLOY_DIR/bin/deploy.sh $flag $SHA"

      - name: Log out of GHCR on the server
        if: always()
        run: ssh staging "docker logout ghcr.io" || true

      # Readiness through Caddy: DB + Redis must be up and the expected release must answer.
      - name: Check /api/v1/health
        run: |
          for attempt in $(seq 1 12); do
            body="$(curl -fsS --max-time 5 "$STAGING_URL/api/v1/health" || true)"
            if [[ "$(jq -r '.status + " " + .version' <<<"$body" 2>/dev/null)" == "ok $SHA" ]]; then
              echo "healthy: $body"
              exit 0
            fi
            echo "attempt $attempt: ${body:-no response}"
            sleep 5
          done
          echo "::error::staging is not healthy on $SHA"
          exit 1
