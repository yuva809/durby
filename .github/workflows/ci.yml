name: CI

on:
  pull_request:
  push:
    branches: [main, development]

# Superseded PR runs are cancelled; runs on main always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CI: true
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  ci:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      # Version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # Unit + integration. Integration tests start their own Postgres via
      # Testcontainers (Docker is preinstalled on ubuntu-latest).
      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  # Builds the deployable images without pushing, so a broken Dockerfile fails the PR,
  # not the staging deploy. Pushing happens in deploy-staging.yml.
  images:
    name: Docker images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          - { dockerfile: apps/api/Dockerfile, target: runtime }
          - { dockerfile: apps/api/Dockerfile, target: migrate }
          - { dockerfile: apps/web/Dockerfile, target: runtime }
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: false
          cache-from: type=gha,scope=${{ matrix.dockerfile }}-${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.dockerfile }}-${{ matrix.target }}

  # Playwright smoke suite against the local stack (docs/platform/web-shell.md → Tests): login, nav
  # filtering and theme by domain on durby.localhost and partner-demo.localhost.
  e2e:
    name: E2E smoke (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Start Postgres, Redis, Mailpit
        run: docker compose up -d --wait postgres redis mailpit
      - name: Configure api
        run: cp apps/api/.env.example apps/api/.env
      - name: Migrate and seed
        run: |
          pnpm --filter @durby/api db:generate
          pnpm --filter @durby/api db:deploy
          pnpm turbo run build --filter=@durby/api --filter=@durby/web
          DURBY_ALLOW_DEV_SEED=1 node apps/api/dist/cli/seed-dev.js
      - name: Install Chromium
        run: pnpm --filter @durby/web exec playwright install --with-deps chromium
      - name: Run Playwright
        run: pnpm --filter @durby/web e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
