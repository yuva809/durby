packages:
  - apps/*
  - packages/*
  - tools/*
allowBuilds:
  '@prisma/engines': true
  '@swc/core': true
  esbuild: true
  prisma: true
  unrs-resolver: true
  # Optional native speedups pulled in by testcontainers (ssh2/docker-modem); not needed.
  cpu-features: false
  protobufjs: false
  ssh2: false
  # Optional native speedup of msgpackr (BullMQ, ADR 0013); msgpackr falls back to plain JS.
  msgpackr-extract: false
  # Its postinstall only prints a donation message (opencollective-postinstall); OCR needs no build.
  tesseract.js: false
minimumReleaseAgeExclude:
  - nodemailer@10.2.0
# Security fixes for transitive dependencies (docs/reviews/phase-1.md → R4, R5). Remove an entry once
# its parent package requires the fixed version itself.
overrides:
  body-parser@<2.4.0: '>=2.4.0'
  multer@<2.5.0: '>=2.5.0 <3'
  handlebars@<4.7.10: '>=4.7.10 <5'
