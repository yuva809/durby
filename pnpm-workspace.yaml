packages:
  - apps/*
  - packages/*
allowBuilds:
  '@prisma/engines': true
  '@swc/core': true
  esbuild: true
  prisma: true
  unrs-resolver: true
  # Optional native speedups pulled in by testcontainers (ssh2/docker-modem); not needed.
  cpu-features: false
  protobufjs: false
  ssh2: false
  # Optional native speedup of msgpackr (BullMQ, ADR 0013); msgpackr falls back to plain JS.
  msgpackr-extract: false
minimumReleaseAgeExclude:
  - nodemailer@10.2.0
