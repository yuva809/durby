# Local development infrastructure. Ports are bound to localhost only.
# Override host ports in a root .env (DURBY_POSTGRES_PORT, DURBY_REDIS_PORT, DURBY_SMTP_PORT,
# DURBY_MAILPIT_UI_PORT) if 5432/6379/1025/8025 are taken.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: durby
    ports:
      - '127.0.0.1:${DURBY_POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d durby']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - '127.0.0.1:${DURBY_REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  # Catches all mail locally (docs/platform/auth.md). SMTP 127.0.0.1:1025, UI http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.31.4
    ports:
      - '127.0.0.1:${DURBY_SMTP_PORT:-1025}:1025'
      - '127.0.0.1:${DURBY_MAILPIT_UI_PORT:-8025}:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  redis-data:
